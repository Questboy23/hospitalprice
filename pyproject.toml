[project]
name = "hospitalprice"
version = "0.1.0"
description = "Ohio hospital price transparency: compliance and negotiated-price dispersion"
requires-python = ">=3.11,<3.12"
dependencies = [
  "duckdb>=1.1",
  "ijson>=3.3",
  "httpx>=0.27",
  "zstandard>=0.22",
  "pyyaml>=6.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
  "rapidfuzz>=3.9",
  "typer>=0.12",
  "rich>=13.7",
  "chardet>=5.2",
]

[project.scripts]
hospitalprice = "hospitalprice.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hospitalprice"]
